      value: 1.0
    - name: "contentRatio"
      type: "float"
      value: 2.0
    - name: "heightCompressionFactor"
      type: "float"
      value: 1.0
    - name: "RawImageRectSize"
      type: "string"
      value: "600x300"
    - name: "CamWidth"
      type: "int"
      value: 1280
    - name: "CamHeight"
      type: "int"
      value: 640
    - name: "CamFPS"
      type: "int"
      value: 30
    - name: "CamBitrate"
      type: "int"
      value: 4000000
    - name: "AudioStreamPort"
      type: "int"
      value: 13580

